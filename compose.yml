# Redpanda = Kafka-API-compatible broker, single binary, no Zookeeper, no JVM.
# Sized deliberately small for a 16GB RAM / dual-core laptop (Latitude E5570).
# Don't run this alongside Spark + MinIO at the same time until you've
# confirmed free RAM with `free -h` -- bring up only what you're working on.

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
      - --pandaproxy-addr=PLAINTEXT://0.0.0.0:8082
      - --advertise-pandaproxy-addr=PLAINTEXT://localhost:8082
    ports:
      - "9092:9092"   # Kafka API (this is what your Python producer connects to)
      - "8082:8082"   # HTTP proxy (optional, useful for quick curl checks)
      - "9644:9644"   # Admin API / metrics
    mem_limit: 1200m
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  # Optional lightweight web UI to browse topics/messages visually.
  # Comment this out if RAM is tight -- it's a "nice to have", not required.
  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    mem_limit: 300m
    depends_on:
      - redpanda

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API (what Spark connects to)
      - "9001:9001"   # Web console (http://localhost:9001)
    mem_limit: 512m
    volumes:
      - minio-data:/data

  # One-shot container that creates the bronze/silver/gold buckets on startup,
  # then exits. Safe to ignore its "exited (0)" status in `docker ps -a`.
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 1; done;
      mc mb --ignore-existing local/bronze;
      mc mb --ignore-existing local/silver;
      mc mb --ignore-existing local/gold;
      mc mb --ignore-existing local/mlflow-artifacts;
      echo 'buckets ready';
      "

  # MLflow tracking server -- SQLite backend (single writer: this container
  # only, nothing else touches the .db file directly, so no concurrency
  # issue), artifacts on the existing MinIO. Lightweight enough for a
  # 16GB/2-core machine alongside Redpanda + MinIO, but keep an eye on RAM
  # if all services run together (`free -h`).
  mlflow:
    # Built from mlflow.Dockerfile = official MLflow image + boto3 (the stock
    # image lacks boto3, so S3/MinIO artifact writes 500). The base tag must
    # match the MLflow version that logged/registered the model (MLmodel records
    # mlflow_version 3.14.0) -- a 2.x server cannot serve a 3.x-registered model.
    # If that base tag doesn't pull, edit mlflow.Dockerfile to the closest v3.x
    # tag matching your client's `mlflow` version (pip show mlflow).
    build:
      context: .
      dockerfile: mlflow.Dockerfile
    container_name: mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      # Reuses the SAME MinIO credentials already defined for the minio
      # service above -- no new/duplicate secret names.
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:////mlflow/mlflow.db
        --artifacts-destination s3://mlflow-artifacts
        --serve-artifacts
        --allowed-hosts "*"
        --cors-allowed-origins "*"
    # MLflow 3.x is much heavier than 2.16: OOM-killed (exit 137) at 400m, 1g,
    # and pinned at the ceiling (99.9%) at 2g -- 3g gives real headroom for
    # model registration/serving. (Your Docker VM has ~8G total, so this still
    # fits alongside minio + api.) --allowed-hosts/--cors let the api container
    # (a different host than localhost) reach it; 3.x's default security
    # middleware is localhost-only and would otherwise reject it.
    mem_limit: 3g
    depends_on:
      - minio-init

  # FastAPI inference service. Loads models:/5g-nidd-attack-classifier@staging
  # from the mlflow container at startup, then serves /predict, /predict/raw,
  # /predict/batch, /drift. Build context is the repo root (".") so the image
  # can copy contracts/ + modeling/ (see modeling/serving/Dockerfile).
  #
  # PREREQUISITE: the model must already be registered on the mlflow server
  # BEFORE this starts, otherwise the startup model-load raises and the
  # container exits. Register once (with the tracking URI pointing at the
  # server) via: python modeling/src/register_model.py
  # `restart: on-failure` lets it keep retrying until the model is there.
  api:
    build:
      context: .
      dockerfile: modeling/serving/Dockerfile
    container_name: nidd-api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      # Needed only if MLflow resolves the model artifact to an s3:// source
      # (vs proxying through the tracking server). Harmless to always set;
      # reuses the same MinIO credentials as the other services.
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    mem_limit: 1g
    restart: on-failure
    depends_on:
      - mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  redpanda-data:
  minio-data:
  mlflow-data: